name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Dependencies and mocked adapters
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python -m unittest discover -s tests -p 'test_*.py'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node --test tests/popup.test.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          python scripts/check_publish.py
      - name: Build and native offline verification
        shell: pwsh
        run: |
          ./Build.ps1 -SkipDependencies
          # The expanded translated secondary-view exports approach 60s on hosted VMs.
          # Keep every assertion and a finite deadline; local default remains 60s.
          ./scripts/verify-native.ps1 -TimeoutSeconds 120
      - name: Self-contained package boundary
        if: matrix.python == '3.14'
        shell: pwsh
        run: |
          ./scripts/package.ps1
          $package=Get-ChildItem build/packages/Prism-*-win-x64.zip
          python scripts/verify-package.py $package.FullName
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
  secrets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Full-history Gitleaks (verified binary)
        shell: pwsh
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'){throw 'Gitleaks checksum mismatch'}
          $scanner=Join-Path $env:RUNNER_TEMP 'gitleaks'
          Expand-Archive $archive $scanner
          & "$scanner/gitleaks.exe" git . --config .gitleaks.toml --redact --no-banner
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
